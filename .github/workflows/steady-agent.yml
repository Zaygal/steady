name: steady-agent

# The open-weight model runs HERE, not on the author's machine.
# That is the point: the support agent must not depend on the user's own hardware or
# on a proprietary API, and CI gives a clean, reproducible place to run it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "craving | steady | slipped | partner"
        required: true
        default: "craving"
      note:
        description: "optional - anything the person typed"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["agent/**", "tools/**"]

permissions:
  contents: read

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      STEADY_GGUF: models/gemma-3-12b-it-Q4_K_M.gguf
      STEADY_HF_REPO: ggml-org/gemma-3-12b-it-GGUF
      STEADY_HF_FILE: gemma-3-12b-it-Q4_K_M.gguf
      MODE: ${{ github.event.inputs.mode || 'craving' }}
      NOTE: ${{ github.event.inputs.note || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Report the runner we actually got
        run: nproc && free -m && df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the open-weight model (7.3 GB - download it once, not every run)
        id: gguf
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.STEADY_HF_FILE }}

      - name: Fetch the open-weight Gemma GGUF (official ggml-org repo only)
        run: |
          mkdir -p models
          if [ -s "$STEADY_GGUF" ]; then
            echo "cache hit - reusing the model already on the runner"
          else
            curl -sSL --fail --retry 3 -o "$STEADY_GGUF" \
              "https://huggingface.co/$STEADY_HF_REPO/resolve/main/$STEADY_HF_FILE"
          fi
          ls -lh "$STEADY_GGUF"
          sha256sum "$STEADY_GGUF" | tee models/SHA256.txt

      - name: Install the open-source llama.cpp runtime
        run: pip install --quiet llama-cpp-python

      - name: Run the Steady policy against the open-weight model
        run: python tools/run_local.py | tee reply.txt

      - name: Upload the reply as the run artifact
        uses: actions/upload-artifact@v4
        with:
          name: steady-reply
          path: reply.txt
